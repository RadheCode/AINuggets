<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AI Nuggets distills the five AI updates worth knowing into a quick daily briefing.">
  <meta name="theme-color" content="#e9ebf9">
  <title>AI Nuggets - AI news, less noise</title>
  <link rel="icon" type="image/svg+xml" href="product/brand-mark.svg">
  <link rel="apple-touch-icon" href="product/og-image.png">
  <link rel="alternate" type="application/atom+xml" title="AI Nuggets" href="https://ai-nuggets.pages.dev/feed.xml">

  <!-- Technical SEO Improvements -->
    <!-- The canonical is set per edition by content-engine/loader.js so each
         ?date=YYYY-MM-DD[&edition=N] briefing is indexed as its own page. -->
    <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "AI Nuggets",
    "url": "https://ai-nuggets.pages.dev/",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://ai-nuggets.pages.dev/?date={date}",
      "query-input": "required name=date"
    }
  }
  </script>

  <!-- Social Media Integration (Open Graph & Twitter Cards) -->
  <meta property="og:title" content="AI Nuggets - AI news, less noise">
  <meta property="og:description" content="Daily briefing of exactly 4-5 essential AI stories. Stay informed without the endless feed.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ai-nuggets.pages.dev/">
  <meta property="og:image" content="https://ai-nuggets.pages.dev/product/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:site_name" content="AI Nuggets">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="AI Nuggets - AI news, less noise">
  <meta name="twitter:description" content="Daily briefing of exactly 4-5 essential AI stories. Stay informed without the endless feed.">
  <meta name="twitter:image" content="https://ai-nuggets.pages.dev/product/og-image.png">

  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="product/config.js"></script>
  <script src="theme.config.js"></script>
  <script src="theme-loader.js"></script>
  
  <!-- Analytics: privacy-minimal first-party analytics are handled by the content Worker -->
  <!-- To add Google Analytics or Cloudflare Web Analytics, place the snippet here -->
</head>
<body>
  <div class="site-frame">
    <header class="site-header">
      <a class="brand" href="#today" data-product-home>
        <span class="brand-mark" aria-hidden="true" data-product-copy="brandMark"></span>
        <span class="brand-copy">
          <strong data-product-copy="brandName"></strong>
          <small data-product-copy="brandTagline"></small>
        </span>
      </a>

      <nav class="nav-tabs" aria-label="Main navigation">
        <a class="active" href="#today" aria-current="page">Today</a>
        <a href="about.html" data-product-copy="aboutLabel"></a>
      </nav>

      <div class="header-actions">
        <span class="current-date">Daily edition</span>
        <div class="streak-control">
          <button class="streak-pill" id="streakPill" type="button" aria-controls="loginMenu" aria-describedby="streakGuidance" aria-expanded="false" aria-live="polite">
            <span class="streak-pill__flame" aria-hidden="true">&#128293;</span>
            <span class="streak-pill__text"><strong id="streakPillCount">0</strong><span class="streak-pill__label" id="streakPillLabel" data-product-copy="guestStreakLabel"></span></span>
          </button>
          <span class="streak-guidance" id="streakGuidance" role="tooltip" data-product-streak-guidance></span>
        </div>
        <button class="color-mode-toggle" id="colorModeToggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
          <span class="mode-icon mode-icon--sun" aria-hidden="true">&#9728;</span>
          <span class="mode-icon mode-icon--moon" aria-hidden="true">&#9790;</span>
        </button>
        <div class="sign-in-control">
          <button class="login-menu-toggle" id="loginMenuToggle" type="button" aria-expanded="false" aria-controls="loginMenu">
            <span class="login-menu-toggle__icon" aria-hidden="true">&#128100;</span>
            <span data-product-copy="loginLabel"></span>
          </button>
          <div class="login-menu" id="loginMenu" hidden>
            <p class="login-menu__title" data-product-copy="loginMenuTitle"></p>
            <p class="login-menu__description" data-product-copy="loginMenuDescription"></p>
            <div class="google-sign-in-option">
              <div class="google-sign-in-button" id="googleSignInButton" aria-hidden="true">
                <span class="google-sign-in-button__mark" aria-hidden="true">G</span>
                <span data-product-copy="continueWithGoogleLabel"></span>
              </div>
              <div class="google-sign-in-target" id="googleSignInTarget"></div>
            </div>
          </div>
          <button class="account-menu-toggle" id="accountMenuToggle" type="button" aria-expanded="false" aria-controls="accountMenu" hidden>
            <span class="account-avatar" id="accountAvatar" aria-hidden="true"></span>
            <span class="account-name" id="accountName"></span>
            <span class="account-menu-chevron" aria-hidden="true">⌄</span>
          </button>
          <div class="account-menu" id="accountMenu" hidden>
            <div class="account-menu__profile">
              <span class="account-avatar" id="accountMenuAvatar" aria-hidden="true"></span>
              <span><strong id="accountMenuName"></strong><small id="accountEmail"></small></span>
            </div>
            <div class="account-menu__divider" aria-hidden="true"></div>
            <button class="sign-out-button" id="signOutButton" type="button">Sign out</button>
          </div>
          <output class="sign-in-status" id="signInStatus" aria-live="polite"></output>
        </div>
      </div>
    </header>

    <main id="today">
      <section class="briefing-intro" aria-labelledby="pageTitle">
        <div>
          <p class="eyebrow"><span class="eyebrow-indicator" aria-hidden="true"></span> <span data-product-copy="eyebrow"></span></p>
          <h1 id="pageTitle" data-product-headline></h1>
        </div>
        <div class="briefing-copy">
          <p class="briefing-copy__shine" data-product-copy="briefingDescription"></p>
          <div class="briefing-meta" aria-label="Briefing details">
            <span data-product-copy="storyCountLabel"></span>
            <span data-product-copy="updateCadenceLabel"></span>
          </div>
        </div>
      </section>

      <section class="story-grid" id="storyGrid"></section>
    </main>

    <footer class="site-footer">
      <span data-product-copy="footer"></span>
      <button class="support-tab" id="supportTab" type="button" aria-haspopup="dialog" aria-controls="supportDialog">
        <span aria-hidden="true">&#9829;</span><span data-product-copy="supportLabel"></span>
              <span class="support-heart" aria-hidden="true"></span>
              <span class="support-heart" aria-hidden="true"></span>
            </button>
    </footer>

          <div class="edge-tabs" id="edgeTabs">
            <button class="feedback-tab" id="feedbackTab" type="button" aria-haspopup="dialog" aria-controls="feedbackDialog">
              <span aria-hidden="true">★</span><span>Feedback</span>
            </button>
                      <button class="newsletter-tab" id="newsletterTab" type="button" aria-haspopup="dialog" aria-controls="newsletterDialog">
                        <span aria-hidden="true">✉</span><span data-product-copy="newsletterTabLabel"></span>
                      </button>
                    </div>
      </div>

  <dialog class="feedback-dialog" id="feedbackDialog" aria-labelledby="feedbackTitle" aria-describedby="feedbackDescription">
    <button class="dialog-close" id="feedbackDialogClose" type="button" aria-label="Close feedback form">&times;</button>
    <span class="dialog-mark feedback-dialog-mark" aria-hidden="true">★</span>
    <h2 id="feedbackTitle">How are we doing?</h2>
    <p id="feedbackDescription">A quick note helps us make each briefing more useful.</p>
    <form id="feedbackForm">
      <label for="feedbackEmail">Email address</label>
      <div class="feedback-email-control">
        <input id="feedbackEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <span class="feedback-email-lock" id="feedbackEmailLock" aria-hidden="true" hidden>Locked</span>
      </div>
      <fieldset class="feedback-rating" id="feedbackRating">
        <legend>Your rating</legend>
        <div class="feedback-rating__choices" aria-label="Choose a rating from one to five stars">
          <span class="feedback-rating__stars" aria-hidden="true">
            <span class="feedback-rating__star"></span>
            <span class="feedback-rating__star"></span>
            <span class="feedback-rating__star"></span>
            <span class="feedback-rating__star"></span>
            <span class="feedback-rating__star"></span>
          </span>
          <input id="rating-1" name="ratingHalves" type="radio" value="2" required><label for="rating-1">1 star</label>
          <input id="rating-2" name="ratingHalves" type="radio" value="4"><label for="rating-2">2 stars</label>
          <input id="rating-3" name="ratingHalves" type="radio" value="6"><label for="rating-3">3 stars</label>
          <input id="rating-4" name="ratingHalves" type="radio" value="8"><label for="rating-4">4 stars</label>
          <input id="rating-5" name="ratingHalves" type="radio" value="10"><label for="rating-5">5 stars</label>
        </div>
        <output class="feedback-rating__display" id="feedbackRatingDisplay" aria-live="polite">Choose a rating</output>
      </fieldset>
      <label for="feedbackMessage">Feedback</label>
      <textarea id="feedbackMessage" name="message" rows="4" minlength="20" maxlength="4000" placeholder="Tell us what you think..." required></textarea>
      <button class="feedback-submit" id="feedbackSubmit" type="submit">Send feedback</button>
      <output class="feedback-message" id="feedbackMessageStatus" aria-live="polite"></output>
    </form>
  </dialog>

  <dialog class="feedback-dialog newsletter-dialog" id="newsletterDialog" aria-labelledby="newsletterTitle" aria-describedby="newsletterDescription">
    <button class="dialog-close" id="newsletterDialogClose" type="button" aria-label="Close newsletter dialog">&times;</button>
    <span class="dialog-mark newsletter-dialog-mark" aria-hidden="true">✉</span>
    <h2 id="newsletterTitle" data-product-copy="newsletterTitle"></h2>
    <p id="newsletterDescription" data-product-copy="newsletterDescription"></p>
    <form id="newsletterForm">
      <label for="newsletterEmail" data-product-copy="newsletterEmailLabel"></label>
      <div class="feedback-email-control">
        <input id="newsletterEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <span class="feedback-email-lock" id="newsletterEmailLock" aria-hidden="true" hidden>Locked</span>
      </div>
      <button class="feedback-submit" id="newsletterSubmit" type="submit" data-product-copy="newsletterSubscribeLabel"></button>
      <output class="feedback-message" id="newsletterMessageStatus" aria-live="polite"></output>
    </form>
  </dialog>

  <dialog class="support-dialog" id="supportDialog" aria-labelledby="supportTitle" aria-describedby="supportDescription">
    <button class="dialog-close" id="supportDialogClose" type="button" aria-label="Close support dialog">&times;</button>
    <span class="dialog-mark support-dialog-mark" aria-hidden="true">&#9829;</span>
    <h2 id="supportTitle" data-product-copy="supportTitle"></h2>
    <p id="supportDescription" data-product-copy="supportDescription"></p>
    <div class="support-body" id="supportBody" aria-live="polite"></div>
      </dialog>

  <dialog class="story-dialog" id="storyDialog" aria-labelledby="storyDialogTitle">
    <button class="dialog-close" id="storyDialogClose" type="button" aria-label="Close story summary">&times;</button>
    <p class="story-dialog-category" id="storyDialogCategory"></p>
    <h2 id="storyDialogTitle"></h2>
    <div class="story-summary-contexts" role="group" aria-label="Summary detail">
    </div>
    <div id="storyDialogSummary" tabindex="0" aria-label="Story summary. Use Arrow Up and Arrow Down to scroll."></div>
    <div class="story-dialog-actions">
      <div class="story-dialog-navigation-group">
        <div class="story-dialog-navigation" aria-label="Story navigation" role="group">
          <button class="story-dialog-navigation-button" id="storyDialogPrevious" type="button" aria-label="Previous story" disabled><span aria-hidden="true">&larr;</span><span>Previous</span></button>
          <button class="story-dialog-navigation-button" id="storyDialogNext" type="button" aria-label="Next story"><span>Next</span><span aria-hidden="true">&rarr;</span></button>
        </div>
        <p class="story-dialog-navigation-hint" aria-label="Keyboard shortcuts. Tab switches summary level, up and down arrows scroll, left and right arrows browse stories.">
          <span class="story-dialog-navigation-hint-item"><span class="story-dialog-kbd" aria-hidden="true">Tab</span> switch summary</span>
          <span class="story-dialog-navigation-hint-item"><span class="story-dialog-kbd" aria-hidden="true">&uarr;</span><span class="story-dialog-kbd" aria-hidden="true">&darr;</span> scroll</span>
          <span class="story-dialog-navigation-hint-item"><span class="story-dialog-kbd" aria-hidden="true">&larr;</span><span class="story-dialog-kbd" aria-hidden="true">&rarr;</span> browse stories</span>
        </p>
      </div>
      <div class="story-dialog-actions-group">
        <button class="story-dialog-share" id="storyDialogShare" type="button" data-product-copy="storyShareButtonLabel" aria-haspopup="dialog"></button>
        <a class="story-dialog-source" id="storyDialogSource" target="_blank" rel="noopener noreferrer">Read the source <span aria-hidden="true">&nearr;</span></a>
      </div>
    </div>
  </dialog>

  <dialog class="story-share-dialog" id="storyShareDialog" aria-labelledby="storyShareDialogTitle">
    <button class="dialog-close" id="storyShareDialogClose" type="button" aria-label="Close share dialog">&times;</button>
    <h2 id="storyShareDialogTitle" data-product-copy="storyShareDialogTitle"></h2>
    <p class="story-share-dialog-description" id="storyShareDialogDescription" data-product-copy="storyShareDialogDescription"></p>
    <div class="story-share-url">
      <label class="story-share-url-label" id="storyShareUrlLabel" for="storyShareUrl" data-product-copy="storyShareUrlLabel"></label>
      <div class="story-share-url-row">
        <input class="story-share-url-input" id="storyShareUrl" type="text" readonly />
        <button class="story-share-copy-btn" id="storyShareCopyButton" type="button" data-product-copy="storyShareCopyLabel" aria-live="polite"></button>
      </div>
    </div>
    <div class="story-share-platforms" id="storySharePlatforms" role="group" aria-label="Share this story"></div>
  </dialog>

  <div class="celebration-toast" id="celebrationToast" role="alert" aria-live="assertive">
    <span class="celebration-toast__emoji" data-celebration-emoji></span>
    <span class="celebration-toast__title" data-celebration-title></span>
    <span class="celebration-toast__subtitle" data-celebration-subtitle></span>
    <span class="celebration-toast__streak" data-celebration-streak></span>
  </div>

  <script src="product/apply-copy.js"></script>
  <script src="content-engine/loader.js"></script>
  <script src="product/company-images.js"></script>
  <script src="content-engine/render.js"></script>
  <script src="content-engine/celebration.js"></script>
  <script src="script.js"></script>
</body>
</html>
